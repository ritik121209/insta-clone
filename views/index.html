<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./public/style.css">
</head>
<body>

<div class="wrap">
  <div class="columns">
    <div class="phone-preview" aria-hidden="true">
      <svg viewBox="0 0 380 720" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="10" width="360" height="700" rx="36" fill="none" stroke="#c7c7c7" stroke-width="10"/>
        <rect x="30" y="60" width="320" height="560" rx="4" fill="#e8e8e8"/>
        <circle cx="190" cy="160" r="34" fill="#c7c7c7"/>
        <rect x="120" y="210" width="140" height="10" rx="5" fill="#d0d0d0"/>
        <rect x="70" y="260" width="240" height="60" rx="8" fill="#f2f2f2" stroke="#d8d8d8"/>
        <rect x="70" y="340" width="240" height="60" rx="8" fill="#f2f2f2" stroke="#d8d8d8"/>
        <rect x="70" y="420" width="240" height="40" rx="8" fill="#8fd0fb"/>
      </svg>
    </div>

    <div class="auth-col">
      <div class="card">
        <h1 class="logo">Instagram</h1>
        <form id="loginForm" autocomplete="off">
          <div class="field">
            <input type="text" id="username" />
            <label for="username">Phone number, username, or email</label>
          </div>
          <div class="field">
            <input type="password" id="password" />
            <label for="password">Password</label>
            <button type="button" class="show-toggle" id="toggleBtn">Show</button>
          </div>
          <button type="submit" class="login-btn" id="loginBtn" disabled>Log in</button>
        </form>

        <div class="divider"><span class="line line-l" style="flex:1;height:1px;background:var(--divider);"></span><span>OR</span><span class="line" style="flex:1;height:1px;background:var(--divider);"></span></div>

        <button class="fb-login" type="button">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M16 8.05A8 8 0 1 0 6.74 16v-5.61H4.71V8.05h2.03V6.28c0-2.01 1.2-3.12 3.02-3.12.87 0 1.79.16 1.79.16v1.97H10.5c-.99 0-1.3.62-1.3 1.25v1.5h2.22l-.36 2.34H9.2V16A8 8 0 0 0 16 8.05Z"/></svg>
          Log in with Facebook
        </button>

        <button class="forgot" type="button">Forgot password?</button>
      </div>

      <div class="signup-card">
        Don't have an account?<a href="/signup">Sign up</a>
      </div>

      <div class="get-app">
        <p style="margin:0 0 4px;">Get the app.</p>
        <div class="badges" aria-hidden="true">
          <svg width="120" height="40" viewBox="0 0 120 40"><rect width="120" height="40" rx="6" fill="#000"/><text x="60" y="24" font-size="11" fill="#fff" text-anchor="middle" font-family="sans-serif">App Store</text></svg>
          <svg width="120" height="40" viewBox="0 0 120 40"><rect width="120" height="40" rx="6" fill="#000"/><text x="60" y="24" font-size="10" fill="#fff" text-anchor="middle" font-family="sans-serif">Google Play</text></svg>
        </div>
      </div>
    </div>
  </div>
</div>

<footer>
  <div class="footer-links">
    <a href="#" onclick="return false;">Meta</a>
    <a href="#" onclick="return false;">About</a>
    <a href="#" onclick="return false;">Blog</a>
    <a href="#" onclick="return false;">Jobs</a>
    <a href="#" onclick="return false;">Help</a>
    <a href="#" onclick="return false;">API</a>
    <a href="#" onclick="return false;">Privacy</a>
    <a href="#" onclick="return false;">Terms</a>
    <a href="#" onclick="return false;">Locations</a>
    <a href="#" onclick="return false;">Instagram Lite</a>
    <a href="#" onclick="return false;">Threads</a>
  </div>
  <div class="footer-bottom">
    <label class="visually-hidden" for="lang">Language</label>
    <select id="lang"><option>English</option></select>
    <span>© 2026 Instagram-style demo UI</span>
  </div>
</footer>

<script src="./views/script.js"></script>
</body>
</html>
